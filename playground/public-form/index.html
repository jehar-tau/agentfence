<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Public Form Demo — AgentFence Playground</title>
    <link rel="stylesheet" href="/shared/style.css" />
  </head>
  <body>
    <div class="demo-banner">AgentFence demo — synthetic data only, not a real public form</div>
    <main class="site">
      <h1>🌐 Public Form</h1>
      <p class="subtitle">public-form.localhost — a public-facing page, for trying AgentFence</p>
      <div class="field">
        <div class="label">Your message (visible to anyone)</div>
        <textarea rows="4" placeholder="Paste something here…"></textarea>
      </div>
      <button type="button">Submit (demo only — does nothing)</button>
      <p class="hint">
        Try pasting something copied from Bank Demo or Client A Demo — AgentFence should block it.
      </p>
    </main>
  </body>
</html>
