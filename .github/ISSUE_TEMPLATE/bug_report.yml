name: Bug
description: Something doesn't work the way it should.
labels: ['bug']
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Protect site X with context Y
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AgentFence version
      description: chrome://extensions → AgentFence → version
    validations:
      required: true
  - type: input
    id: chrome-version
    attributes:
      label: Chrome version
  - type: textarea
    id: context
    attributes:
      label: Anything else?
